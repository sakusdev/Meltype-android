name: dev-android-input-layers-v2

on:
  push:
    branches:
      - work/android-ime
    paths:
      - .github/workflows/dev-android-input-layers-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/android-ime
          fetch-depth: 0
      - name: Fix one-shot matcher
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-android-input-layers.py')
          s = p.read_text(encoding='utf-8')
          anchor = '''def rr(pattern, repl):\n    global text\n    text2, count = re.subn(pattern, repl, text, flags=re.S)'''
          replacement = '''def rf(old, new):\n    global text\n    if old not in text:\n        raise SystemExit(f'expected at least one match: {old[:120]!r}')\n    text = text.replace(old, new, 1)\n\ndef rr(pattern, repl):\n    global text\n    text2, count = re.subn(pattern, repl, text, flags=re.S)'''
          if anchor not in s:
              raise SystemExit('rr anchor missing')
          s = s.replace(anchor, replacement, 1)
          marker = '''# Direct modes should bypass MeltypeSession entirely.\nr('''
          if marker not in s:
              raise SystemExit('direct-mode marker missing')
          s = s.replace(marker, '''# Direct modes should bypass MeltypeSession entirely.\nrf(''', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Apply Android input layer patch
        run: python3 tools/apply-android-input-layers.py
      - name: Commit Android input layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Meltype.Android/MeltypeInputMethodService.cs
          git commit -m "Add Android numeric symbol and emoji input layers"
          git push origin HEAD:work/android-ime
