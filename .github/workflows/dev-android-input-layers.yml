name: dev-android-input-layers

on:
  push:
    branches:
      - work/android-ime
    paths:
      - tools/apply-android-input-layers.py
      - .github/workflows/dev-android-input-layers.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/android-ime
          fetch-depth: 0
      - name: Apply Android input layer patch
        run: python3 tools/apply-android-input-layers.py
      - name: Commit Android input layers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Meltype.Android/MeltypeInputMethodService.cs
          git commit -m "Add Android numeric symbol and emoji input layers"
          git push origin HEAD:work/android-ime
