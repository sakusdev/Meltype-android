name: dev-android-ui-polish2

on:
  push:
    branches:
      - work/android-ime
    paths:
      - tools/apply-android-ui-polish2.py
      - .github/workflows/dev-android-ui-polish2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/android-ime
          fetch-depth: 0
      - name: Apply screenshot-driven UI polish
        run: python3 tools/apply-android-ui-polish2.py
      - name: Commit UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Meltype.Android/MeltypeInputMethodService.cs
          git commit -m "Tune Android keyboard from device screenshots"
          git push origin HEAD:work/android-ime
