name: dev-android-ime-next-pass

on:
  push:
    branches:
      - work/android-ime
    paths:
      - tools/apply-android-ime-next-pass.py
      - .github/workflows/dev-android-ime-next-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/android-ime
          fetch-depth: 0

      - name: Apply next IME pass
        run: python3 tools/apply-android-ime-next-pass.py

      - name: Commit patched source
        shell: bash
        run: |
          if git diff --quiet -- src/Meltype.Android/MeltypeInputMethodService.cs; then
            echo "No source changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Meltype.Android/MeltypeInputMethodService.cs
          git commit -m "Improve Android IME gestures and key handling"
          git push origin HEAD:work/android-ime
