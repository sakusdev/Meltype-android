name: Android

on:
  push:
    branches:
      - main
      - work/android-ime
    paths:
      - "src/Meltype.Android/**"
      - "src/Meltype.Core/**"
      - "dictionaries/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "src/Meltype.Android/**"
      - "src/Meltype.Core/**"
      - "dictionaries/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Install Android workload
        run: dotnet workload install android --source https://api.nuget.org/v3/index.json

      - name: Restore
        run: dotnet restore src/Meltype.Android/Meltype.Android.csproj --source https://api.nuget.org/v3/index.json

      - name: Publish APK
        run: >
          dotnet publish src/Meltype.Android/Meltype.Android.csproj
          -c Release
          -f net10.0-android
          --source https://api.nuget.org/v3/index.json
          -p:AndroidPackageFormat=apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: meltype-android-apk
          path: src/Meltype.Android/bin/Release/net10.0-android/publish/*.apk
          if-no-files-found: error
