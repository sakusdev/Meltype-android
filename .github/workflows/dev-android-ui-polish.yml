name: dev-android-ui-polish

on:
  push:
    branches:
      - work/android-ime
    paths:
      - tools/apply-android-ui-polish.py
      - .github/workflows/dev-android-ui-polish.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/android-ime
          fetch-depth: 0
      - name: Apply UI polish
        run: python3 tools/apply-android-ui-polish.py
      - name: Commit UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Meltype.Android/MeltypeInputMethodService.cs
          git commit -m "Polish Android keyboard UI"
          git push origin HEAD:work/android-ime
